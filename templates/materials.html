{% extends "base.html" %}
{% block title %}Материалы к урокам — Информатика{% endblock %}

{% block content %}
<h2>Материалы к урокам</h2>

<div style="margin-bottom: 1.5rem;">
    <button onclick="filterMaterials('all')" class="filter-btn active">Все</button>
    <button onclick="filterMaterials('oge')" class="filter-btn">ОГЭ</button>
    <button onclick="filterMaterials('ege')" class="filter-btn">ЕГЭ</button>
</div>

<ul class="material-list">
    {% for m in materials %}
        <!-- Добавляем data-type для фильтрации -->
        <li class="material-item" data-type="{{ m.link }}">
            <div>
                <strong>{{ m.title }}</strong>
                <span class="desc">{{ m.desc }}</span>
            </div>
            <a href="{{ m.link }}" class="download-btn" download>Скачать</a>
        </li>
    {% endfor %}
</ul>

<style>
    .filter-btn {
        padding: 8px 16px;
        border: none;
        background: #ecf0f1;
        color: #2c3e50;
        cursor: pointer;
        border-radius: 6px;
        font-weight: 600;
        transition: all 0.3s;
        margin-right: 8px;
    }
    .filter-btn.active, .filter-btn:hover {
        background: #3498db;
        color: white;
    }
</style>

<script>
    function filterMaterials(type) {
        const items = document.querySelectorAll('.material-item');
        
        items.forEach(item => {
            const link = item.getAttribute('data-type');
            let show = true;

            if (type === 'oge' && !link.includes('/oge/')) show = false;
            if (type === 'ege' && !link.includes('/ege/')) show = false;

            item.style.display = show ? 'flex' : 'none';
        });

        // Подсветка активной кнопки
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
    }
</script>
{% endblock %}
